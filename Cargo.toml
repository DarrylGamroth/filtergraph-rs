[workspace]
members = [
    "crates/filtergraph-blas",
    "crates/filtergraph-algorithms",
    "crates/filtergraph-fgn",
    "crates/filtergraph-fgn-bundle",
]
resolver = "3"

[workspace.package]
version = "0.2.2"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
num-traits = { version = "0.2.19", default-features = false, features = ["libm"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.4"
serde_json = "1.0.145"

[profile.release]
panic = "unwind"
