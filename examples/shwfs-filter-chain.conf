{
    node.name = filtergraph-shwfs-example
    filter.graph = {
        nodes = [
            {
                type = ndarray
                name = measure
                plugin = "@FILTERGRAPH_FGN_PLUGIN@"
                label = shack-hartmann-image-f32
                config = {
                    image_size = [ 2 2 ]
                    subaperture_size = [ 1 2 ]
                    subaperture_count = 2
                    image_schema = pipewireao/calibrated-pixels-f32/1
                    initial_subaperture_origins = [ [ 0 0 ] [ 1 0 ] ]
                    coordinate_scale = 1.0
                    pixel_threshold = 0.0
                    flux_threshold = 0.0
                    rate = [ 1000 1 ]
                    reference_slopes = null
                    active = null
                }
            }
            {
                type = ndarray
                name = reconstruct
                plugin = "@FILTERGRAPH_FGN_PLUGIN@"
                label = shwfs-reconstructor-f32
                config = {
                    reconstructed_count = 1
                    subaperture_count = 2
                    initial_reconstructor = [ 1.0 0.0 0.0 0.0 ]
                    reconstructed_schema = pipewireao/controller-residual-error-f32/1
                    rate = [ 1000 1 ]
                }
            }
            {
                type = ndarray
                name = integrate
                plugin = "@FILTERGRAPH_FGN_PLUGIN@"
                label = leaky-integrator-f32
                config = {
                    extent = 1
                    initial_state = 0.0
                    input_schema = pipewireao/controller-residual-error-f32/1
                    output_schema = pipewireao/requested-pdm-command-f32/1
                    rate = [ 1000 1 ]
                }
                props = { gain = 1.0 pole = 0.0 }
            }
            {
                type = ndarray
                name = command
                plugin = "@FILTERGRAPH_FGN_PLUGIN@"
                label = pdm-command-f32
                config = {
                    actuator_count = 1
                    command_limits = [ -1.0 1.0 ]
                    rate = [ 1000 1 ]
                    slew_limit = null
                    initial_current = null
                }
            }
        ]
        links = [
            { output = "measure:slopes" input = "reconstruct:slopes" }
            { output = "reconstruct:reconstructed" input = "integrate:input" }
            { output = "integrate:output" input = "command:requested" }
        ]
        inputs = [
            "measure:image"
            "measure:subaperture-origins"
            "measure:coordinates"
            "measure:reference-slopes"
            "measure:thresholds"
            "measure:active"
            "reconstruct:reconstructor"
        ]
        outputs = [ "command:demanded" ]
    }
}
