{
    node.name = filtergraph-pwfs-row-example
    filter.graph = {
        workers = {
            helpers = 3
        }
        nodes = [
            {
                type = ndarray
                name = calibrate
                plugin = "@FILTERGRAPH_FGN_PLUGIN@"
                label = pixel-calibration-row-u16-f32
                config = {
                    image_size = [ 8 8 ]
                    row_block_rows = 2
                    rate = [ 1000 1 ]
                    initial_flat = null
                    initial_background = null
                }
            }
            {
                type = ndarray
                name = reconstruct
                plugin = "@FILTERGRAPH_FGN_PLUGIN@"
                label = pwfs-row-reconstructor-f32
                config = {
                    image_size = [ 8 8 ]
                    row_block_rows = 2
                    pupil_size = [ 2 2 ]
                    pupil_origins = [ [ 0 0 ] [ 0 4 ] [ 4 0 ] [ 6 4 ] ]
                    pupil_mask = [ true false true true ]
                    reconstructed_count = 2
                    reconstructed_schema = pipewireao/controller-residual-error-f32/1
                    rate = [ 1000 1 ]
                    initial_reconstructor = null
                }
            }
        ]
        links = [
            {
                output = "calibrate:calibrated"
                input = "reconstruct:row-block"
            }
        ]
        inputs = [
            "calibrate:raw"
            "calibrate:flat"
            "calibrate:background"
            "reconstruct:pupil-origins"
            "reconstruct:pupil-mask"
            "reconstruct:reconstructor"
        ]
        outputs = [
            "reconstruct:reconstruction-pixels"
            "reconstruct:mean-pupil-intensity"
            "reconstruct:reconstructed"
        ]
    }
}
