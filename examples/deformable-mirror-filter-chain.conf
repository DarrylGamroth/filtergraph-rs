{
    node.name = filtergraph-deformable-mirror-example
    filter.graph = {
        nodes = [
            {
                type = ndarray
                name = controller-to-vdm
                plugin = "@FILTERGRAPH_FGN_PLUGIN@"
                label = controller-to-vdm-f32
                config = {
                    controller_command_count = 277
                    active_vdm_count = 277
                    rate = [ 1000 1 ]
                }
            }
            {
                type = ndarray
                name = vdm-to-pdm
                plugin = "@FILTERGRAPH_FGN_PLUGIN@"
                label = vdm-to-pdm-f32
                config = {
                    active_vdm_count = 277
                    full_vdm_count = 277
                    physical_actuator_count = 277
                    rate = [ 1000 1 ]
                }
            }
            {
                type = ndarray
                name = command
                plugin = "@FILTERGRAPH_FGN_PLUGIN@"
                label = pdm-command-f32
                config = {
                    actuator_count = 277
                    command_limits = [ -1.0 1.0 ]
                    rate = [ 1000 1 ]
                    slew_limit = null
                    initial_current = null
                }
            }
            {
                type = ndarray
                name = pdm-feedback-to-vdm
                plugin = "@FILTERGRAPH_FGN_PLUGIN@"
                label = pdm-feedback-to-vdm-f32
                config = {
                    active_vdm_count = 277
                    full_vdm_count = 277
                    physical_actuator_count = 277
                    rate = [ 1000 1 ]
                }
            }
            {
                type = ndarray
                name = vdm-feedback-to-controller
                plugin = "@FILTERGRAPH_FGN_PLUGIN@"
                label = vdm-feedback-to-controller-f32
                config = {
                    controller_command_count = 277
                    active_vdm_count = 277
                    rate = [ 1000 1 ]
                }
            }
        ]
        links = [
            {
                output = "controller-to-vdm:vdm-command"
                input = "vdm-to-pdm:vdm-command"
            }
            {
                output = "vdm-to-pdm:requested-pdm-command"
                input = "command:requested"
            }
            {
                output = "command:constraint-feedback"
                input = "pdm-feedback-to-vdm:pdm-constraint-feedback"
            }
            {
                output = "pdm-feedback-to-vdm:vdm-constraint-feedback"
                input = "vdm-feedback-to-controller:vdm-constraint-feedback"
            }
        ]
        inputs = [
            "controller-to-vdm:controller-command"
            "controller-to-vdm:controller-to-vdm"
            "vdm-to-pdm:active-to-full"
            "vdm-to-pdm:vdm-to-pdm"
            "pdm-feedback-to-vdm:full-to-active"
            "pdm-feedback-to-vdm:pdm-to-vdm"
            "vdm-feedback-to-controller:vdm-to-controller"
        ]
        outputs = [
            "command:demanded"
            "vdm-feedback-to-controller:controller-constraint-feedback"
        ]
    }
}
