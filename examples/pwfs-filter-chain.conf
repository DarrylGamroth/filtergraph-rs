{
    node.name = filtergraph-pwfs-example
    filter.graph = {
        nodes = [
            {
                type = ndarray
                name = normalize
                plugin = "@FILTERGRAPH_FGN_PLUGIN@"
                label = pyramid-pupil-image-f32
                config = {
                    image_size = [ 4 4 ]
                    pupil_size = [ 2 2 ]
                    pupil_origins = [ [ 0 0 ] [ 0 2 ] [ 2 0 ] [ 2 2 ] ]
                    pupil_mask = [ true false true true ]
                    rate = [ 1000 1 ]
                }
            }
            {
                type = ndarray
                name = reconstruct
                plugin = "@FILTERGRAPH_FGN_PLUGIN@"
                label = pwfs-reconstructor-f32
                config = {
                    reconstructed_count = 2
                    selected_pixel_count = 3
                    reconstructed_schema = pipewireao/controller-residual-error-f32/1
                    rate = [ 1000 1 ]
                    initial_reconstructor = null
                }
            }
        ]
        links = [
            {
                output = "normalize:reconstruction-pixels"
                input = "reconstruct:reconstruction-pixels"
            }
        ]
        inputs = [
            "normalize:image"
            "normalize:pupil-origins"
            "normalize:pupil-mask"
            "reconstruct:reconstructor"
        ]
        outputs = [
            "normalize:reconstruction-pixels"
            "normalize:mean-pupil-intensity"
            "reconstruct:reconstructed"
        ]
    }
}
